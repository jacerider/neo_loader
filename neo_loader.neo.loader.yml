# The loaders `neo_loader` ships.
#
# A loader whose whole content is a fixed block of markup is data, not a
# class: eleven of the module's twelve carried nothing but the string below
# and a filename that restated a rule. The filename is the manager's business
# now — none of these declares a `css`, so every one of them takes the derived
# `src/css/loader/{id}.css` — and the string is here.
#
# The icon loader is deliberately absent. Its markup is computed rather than
# fixed, so it stays a class plugin, which is what the class-based form is for.
#
# @see \Drupal\neo_loader\LoaderManager
# @see \Drupal\neo_loader\LoaderDefault
chasing_dots:
  label: 'Chasing dots'
  markup: |-
    <div class="neo-loader-style neo-loader-chasing-dots">
                  <div class="neo-loader-child neo-loader-dot1"></div>
                  <div class="neo-loader-child neo-loader-dot2"></div>
                </div>
circle:
  label: 'Circle'
  markup: |-
    <div class="neo-loader-style neo-loader-circle">
                  <div class="neo-loader-circle1 neo-loader-child"></div>
                  <div class="neo-loader-circle2 neo-loader-child"></div>
                  <div class="neo-loader-circle3 neo-loader-child"></div>
                  <div class="neo-loader-circle4 neo-loader-child"></div>
                  <div class="neo-loader-circle5 neo-loader-child"></div>
                  <div class="neo-loader-circle6 neo-loader-child"></div>
                  <div class="neo-loader-circle7 neo-loader-child"></div>
                  <div class="neo-loader-circle8 neo-loader-child"></div>
                  <div class="neo-loader-circle9 neo-loader-child"></div>
                  <div class="neo-loader-circle10 neo-loader-child"></div>
                  <div class="neo-loader-circle11 neo-loader-child"></div>
                  <div class="neo-loader-circle12 neo-loader-child"></div>
                </div>
# Misspelled since the loader shipped, and kept as shipped: the label is what
