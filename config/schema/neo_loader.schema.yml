neo_loader.settings:
  type: neo_loader
  mapping:
    _core:
      # Added by the config installer; only exists for merging config.
      requiredKey: false
      type: _core_config_info

# Required by neo_settings.schema.yml, which resolves a variation's stored
# settings via `type: neo_settings.settings.[%parent.plugin]`.
neo_settings.settings.neo_loader:
  type: neo_loader

neo_loader:
  type: mapping
  label: 'Neo Loader Settings'
  mapping:
    loader:
      type: string
      label: Loader
    hide_ajax_message:
      type: boolean
      label: Hide Ajax Message
    always_fullscreen:
      type: boolean
      label: Always Fullscreen
    show_admin_paths:
      type: boolean
      label: Show Admin Paths
    loader_position:
      type: string
      label: Loader Position
    color:
      type: string
      label: Color
