loader:
  version: VERSION
  neo: true
  css:
    component:
      src/css/loader.css: {}
  js:
    src/js/loader.ts: {}
  dependencies:
    - core/drupal
    - core/once
    - core/drupalSettings

loader-ajax:
  version: VERSION
  neo: true
  js:
    src/js/loader-ajax.js: {}
  dependencies:
    - neo_loader/loader
    # The chunk is invoked with (jQuery, ..., Drupal, drupalSettings).
    - core/jquery
    # Deliberately NOT core/drupal.ajax: neo_loader_library_info_alter() makes
    # drupal.ajax depend on this library, so declaring it back is a cycle that
    # hangs library resolution. That inversion is why this library loads before
    # Drupal.Ajax exists, so the chunk installs the override from a Drupal
    # behaviour, on the first behaviour pass, which is the first moment core's
    # ajax script is guaranteed to have run.
    #
    # @see neo_loader_library_info_alter()
    # @see docs/adr/0004-core-s-ajax-library-depends-on-the-override-not-the-reverse.md

ajax:
  version: VERSION
  neo: true
  js:
    src/js/ajax.ts: {}
  dependencies:
    - core/once
    - core/drupal
    - core/drupal.ajax

autosubmit:
  version: VERSION
  neo: true
  js:
    src/js/autosubmit.ts: {}
  dependencies:
    - neo_loader/loader
