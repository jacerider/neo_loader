loader:
  version: VERSION
  neo: true
  css:
    component:
      src/css/loader.css: {}
  js:
    src/js/loader.ts: {}
  dependencies:
    - core/drupal
    - core/once
    - core/drupalSettings

loader-ajax:
  version: VERSION
  neo: true
  js:
    src/js/loader-ajax.js: {}
  dependencies:
    - neo_loader/loader
    # The chunk is invoked with (jQuery, ..., Drupal, drupalSettings).
    - core/jquery
    # Deliberately NOT core/drupal.ajax: neo_loader_library_info_alter() makes
    # drupal.ajax depend on this library, so declaring it back is a cycle that
    # hangs library resolution. That inversion is why this library loads before
    # Drupal.Ajax exists, and why the chunk polls for it instead of using it
    # directly.
    #
    # @see neo_loader_library_info_alter()

ajax:
  version: VERSION
  neo: true
  js:
    src/js/ajax.ts: {}
  dependencies:
    - core/once
    - core/drupal
    - core/drupal.ajax

autosubmit:
  version: VERSION
  neo: true
  js:
    src/js/autosubmit.ts: {}
  dependencies:
    - neo_loader/loader
